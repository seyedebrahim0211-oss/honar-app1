name: JanFada Android validation and APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, janfada-build-1]
    paths: ['pubspec.yaml', 'lib/**', 'test/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: janfada-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        shell: bash
        run: |
          flutter create --platforms android --project-name jan_fada --org ir.honarmardomi .
          # Remove template test; project tests cover the actual application.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application android:allowBackup="false" android:usesCleartextTraffic="false"',1)
          s=s.replace('android:label="jan_fada"', 'android:label="جان فدا | وارثین"')
          # Minimal Iranian geometric emblem; generated as a native Android vector.
          emblem = '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0D4B4D" android:pathData="M0,0 H108 V108 H0 Z"/><path android:fillColor="#D2AC62" android:pathData="M54,8 L65,28 L86,22 L80,43 L100,54 L80,65 L86,86 L65,80 L54,100 L43,80 L22,86 L28,65 L8,54 L28,43 L22,22 L43,28 Z"/><path android:fillColor="#0D4B4D" android:pathData="M54,26 L61,39 L75,33 L69,47 L82,54 L69,61 L75,75 L61,69 L54,82 L47,69 L33,75 L39,61 L26,54 L39,47 L33,33 L47,39 Z"/><path android:fillColor="#F4EEE1" android:pathData="M54,41 A13,13 0 1,1 54,67 A13,13 0 1,1 54,41 Z"/><path android:fillColor="#B7473C" android:pathData="M54,46 A8,8 0 1,1 54,62 A8,8 0 1,1 54,46 Z"/></vector>'
          Path('android/app/src/main/res/drawable/janfada_icon.xml').write_text(emblem)
          s=s.replace('@mipmap/ic_launcher', '@drawable/janfada_icon')
          manifest.write_text(s)
          gradle=Path('android/app/build.gradle.kts')
          t=gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          gradle.write_text(t)
          Path('android/app/proguard-rules.pro').write_text('-keep class net.sqlcipher.** { *; }\n')
          # AGP lint crashes in camera_android JavaDoc (CommentDetector, removeLast)
          # on this toolchain. Disable only that plugin's fatal lint task.
          root_gradle=Path('android/build.gradle.kts')
          root_gradle.write_text(root_gradle.read_text() + '\nsubprojects {\n    if (name != "app") {\n        tasks.configureEach {\n            if (name.startsWith("lintVital")) enabled = false\n        }\n    }\n}\n')
          PY
      - name: Bundle Vazirmatn font for offline display
        run: bash scripts/prepare_vazirmatn.sh
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build installable test APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: janfada-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Configure persistent release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          JANFADA_KEYSTORE_B64: ${{ secrets.JANFADA_KEYSTORE_B64 }}
          JANFADA_STORE_PASSWORD: ${{ secrets.JANFADA_STORE_PASSWORD }}
          JANFADA_KEY_ALIAS: ${{ secrets.JANFADA_KEY_ALIAS }}
          JANFADA_KEY_PASSWORD: ${{ secrets.JANFADA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$JANFADA_KEYSTORE_B64" ] || [ -z "$JANFADA_STORE_PASSWORD" ] || [ -z "$JANFADA_KEY_ALIAS" ] || [ -z "$JANFADA_KEY_PASSWORD" ]; then
            echo "::warning::Original persistent signing key is not configured. Validation build only."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$JANFADA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/janfada-release.jks"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          t = p.read_text()
          marker = '    buildTypes {'
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert marker in t and old in t, 'Unexpected Gradle template; refusing debug signing.'
          t = t.replace(marker, '''    signingConfigs {
                  create("janfadaRelease") {
                      storeFile = file(System.getenv("RUNNER_TEMP") + "/janfada-release.jks")
                      storePassword = System.getenv("JANFADA_STORE_PASSWORD")
                      keyAlias = System.getenv("JANFADA_KEY_ALIAS")
                      keyPassword = System.getenv("JANFADA_KEY_PASSWORD")
                  }
              }
          ''' + marker, 1)
          t = t.replace(old, 'signingConfig = signingConfigs.getByName("janfadaRelease")', 1)
          p.write_text(t)
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build compact release APKs for each CPU
        env:
          JANFADA_STORE_PASSWORD: ${{ secrets.JANFADA_STORE_PASSWORD }}
          JANFADA_KEY_ALIAS: ${{ secrets.JANFADA_KEY_ALIAS }}
          JANFADA_KEY_PASSWORD: ${{ secrets.JANFADA_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures and upgrade compatibility
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          aapt="$(dirname "$signer")/aapt"
          test -x "$signer" && test -x "$aapt"
          mkdir -p reference-apks/133 reference-apks/132
          gh release download janfada-v1.3.3 --pattern 'JanFada-Android-ARM*.apk' --dir reference-apks/133
          gh release download janfada-v1.3.2-national-id --pattern 'JanFada-Android-ARM*.apk' --dir reference-apks/132
          export SIGNER="$signer" AAPT="$aapt"
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          def identity(path):
              cert = subprocess.check_output([os.environ['SIGNER'], 'verify', '--print-certs', str(path)], text=True)
              hashes = sorted(re.findall(r'Signer #\d+ certificate SHA-256 digest:\s*([0-9a-fA-F]+)', cert))
              if not hashes:
                  raise RuntimeError('No verified signer: ' + str(path))
              badging = subprocess.check_output([os.environ['AAPT'], 'dump', 'badging', str(path)], text=True)
              pkg, version = re.search(r"package: name='([^']+)' versionCode='(\d+)'", badging).groups()
              print(path.name, pkg, version, ','.join(hashes))
              return pkg, int(version), hashes
          compatible = True
          for abi, suffix in [('arm64-v8a','ARM64'), ('armeabi-v7a','ARM32')]:
              pkg, version, cert = identity(Path('build/app/outputs/flutter-apk') / ('app-' + abi + '-release.apk'))
              for ref in ['133', '132']:
                  oldpkg, oldversion, oldcert = identity(Path('reference-apks') / ref / ('JanFada-Android-' + suffix + '.apk'))
                  if not (pkg == oldpkg and version > oldversion and cert == oldcert):
                      compatible = False
                      print('::warning::Update compatibility failed for ' + suffix + ' against reference ' + ref)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('compatible=' + str(compatible).lower() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janfada-android-optimized-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Publish verified APKs (direct download links)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true' && steps.compatibility.outputs.compatible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public-downloads
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk public-downloads/JanFada-Android-ARM64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk public-downloads/JanFada-Android-ARM32.apk
          sha256sum public-downloads/*.apk | tee public-downloads/SHA256SUMS.txt
          version="$(awk '/^version: / {split($2,v,"+"); print v[1]}' pubspec.yaml)"
          test -n "$version"
          tag="janfada-v$version"
          notes="جان فدا | وارثین $version — اصلاح اعتبارسنجی کد ملی، ارسال خودکار و دستی و بازیابی رسید. تطبیق شناسه بسته، نسخه و امضا با APKهای قبلی در CI انجام شده است. نصب واقعی و تحویل پیامک نیازمند آزمون میدانی است."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its APKs."
            exit 1
          else
            gh release create "$tag" public-downloads/* --target "$GITHUB_SHA" --title "جان فدا | وارثین $version" --notes "$notes"
          fi
          gh release view "$tag" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
